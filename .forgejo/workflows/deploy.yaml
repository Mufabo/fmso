name: Deploy Hugo site to Codeberg Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: https://github.com/peaceiris/actions-hugo@v3
        with:
          # Keep in sync with the version you use locally.
          hugo-version: '0.154.5'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          # Deploys to the custom domain. Requires the two DNS records
          # described in the README (CNAME + _git-pages-forge-allowlist
          # TXT). To deploy to Codeberg's subdomain instead, set site:
          # to your codeberg.page URL and remove the server: line.
          site: 'https://fatih.macht.sachen.online/'
          server: 'codeberg.page'
          token: ${{ forge.token }}
          source: public/
